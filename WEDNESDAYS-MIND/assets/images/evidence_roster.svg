      <line x1="180" y1="0" x2="180" y2="7" stroke="#c4b5fd" stroke-width="0.8"/>
      
    
      <line x1="200" y1="0" x2="200" y2="14" stroke="#c4b5fd" stroke-width="1.5"/>
      <text x="202" y="20" fill="#a78bfa" font-family="'Courier New', monospace" font-size="8">10cm</text>
    
      <line x1="220" y1="0" x2="220" y2="7" stroke="#c4b5fd" stroke-width="0.8"/>
      
    
      <line x1="240" y1="0" x2="240" y2="7" stroke="#c4b5fd" stroke-width="0.8"/>
      
    
      <line x1="260" y1="0" x2="260" y2="7" stroke="#c4b5fd" stroke-width="0.8"/>
      
    
      <line x1="280" y1="0" x2="280" y2="7" stroke="#c4b5fd" stroke-width="0.8"/>
      
    
      <line x1="300" y1="0" x2="300" y2="14" stroke="#c4b5fd" stroke-width="1.5"/>
      <text x="302" y="20" fill="#a78bfa" font-family="'Courier New', monospace" font-size="8">15cm</text>
    
      <line x1="320" y1="0" x2="320" y2="7" stroke="#c4b5fd" stroke-width="0.8"/>
      
    
      <line x1="340" y1="0" x2="340" y2="7" stroke="#c4b5fd" stroke-width="0.8"/>
      
    
      <line x1="360" y1="0" x2="360" y2="7" stroke="#c4b5fd" stroke-width="0.8"/>
      
    
      <line x1="380" y1="0" x2="380" y2="7" stroke="#c4b5fd" stroke-width="0.8"/>
      
    
      <line x1="400" y1="0" x2="400" y2="14" stroke="#c4b5fd" stroke-width="1.5"/>
      <text x="402" y="20" fill="#a78bfa" font-family="'Courier New', monospace" font-size="8">20cm</text>
    
      <line x1="420" y1="0" x2="420" y2="7" stroke="#c4b5fd" stroke-width="0.8"/>
      
    
      <line x1="440" y1="0" x2="440" y2="7" stroke="#c4b5fd" stroke-width="0.8"/>
      
    
      <line x1="460" y1="0" x2="460" y2="7" stroke="#c4b5fd" stroke-width="0.8"/>
      
    
      <line x1="480" y1="0" x2="480" y2="7" stroke="#c4b5fd" stroke-width="0.8"/>
      
    
      <line x1="500" y1="0" x2="500" y2="14" stroke="#c4b5fd" stroke-width="1.5"/>
      <text x="502" y="20" fill="#a78bfa" font-family="'Courier New', monospace" font-size="8">25cm</text>
    
      <line x1="520" y1="0" x2="520" y2="7" stroke="#c4b5fd" stroke-width="0.8"/>
      
    
    <text x="510" y="16" fill="#f59e0b" font-family="'Courier New', monospace" font-size="9" text-anchor="end">CONFIDENTIAL EVIDENCE</text>
