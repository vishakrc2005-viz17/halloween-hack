<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgVignette" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#161224"/>
      <stop offset="60%" stop-color="#0a0812"/>
      <stop offset="100%" stop-color="#040307"/>
    </radialGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5c07b"/>
      <stop offset="50%" stop-color="#b4975a"/>
      <stop offset="100%" stop-color="#6b5328"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8b5cf6" flood-opacity="0.4"/>
    </filter>
    <filter id="heavyGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(139,92,246,0.06)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="600" fill="url(#bgVignette)"/>
  <rect width="600" height="600" fill="url(#grid)"/>

  <!-- Forensic Border -->
  <rect x="18" y="18" width="564" height="564" fill="none" stroke="#2e1065" stroke-width="2" rx="4"/>
  <rect x="24" y="24" width="552" height="552" fill="none" stroke="rgba(196,181,253,0.2)" stroke-width="1" stroke-dasharray="8 4"/>

  <!-- Corner Ornaments -->
  <path d="M 28 48 L 48 48 L 48 28" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  <path d="M 572 48 L 552 48 L 552 28" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  <path d="M 28 552 L 48 552 L 48 572" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  <path d="M 572 552 L 552 552 L 552 572" fill="none" stroke="#8b5cf6" stroke-width="2"/>

  <!-- Top Forensic Header -->
  <g transform="translate(36, 44)">
    <rect x="0" y="0" width="140" height="20" fill="rgba(76,29,149,0.5)" rx="3" stroke="#8b5cf6" stroke-width="1"/>
    <text x="70" y="14" fill="#ddd6fe" font-family="'Courier New', monospace" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="1">FORENSIC UNIT</text>
    <text x="150" y="15" fill="#a78bfa" font-family="'Cinzel', serif" font-size="12" font-weight="bold" letter-spacing="1.5">NEVERMORE CRIME ARCHIVE // CASE #003</text>
    <text x="528" y="14" fill="#ef4444" font-family="'Courier New', monospace" font-size="11" font-weight="bold" text-anchor="end">ITEM B-03</text>
  </g>

  <!-- Title Banner -->
  <text x="300" y="86" fill="#f5f3ff" font-family="'Cinzel', Georgia, serif" font-size="17" font-weight="bold" text-anchor="middle" letter-spacing="2" filter="url(#dropGlow)">TORN BLUE SILK SIREN SCARF</text>
  <line x1="80" y1="98" x2="520" y2="98" stroke="rgba(139,92,246,0.3)" stroke-width="1"/>

  <!-- Specific Clue Graphics -->
  <!-- Sea Silk Fabric Fragment -->
    <g transform="translate(130, 150)">
      <!-- Stone Gargoyle Talon Catching the Fabric -->
      <path d="M 60 40 L 90 100 L 70 120 L 40 60 Z" fill="#475569" stroke="#1e293b" stroke-width="2"/>
      <path d="M 80 90 L 100 130 L 85 140 L 65 105 Z" fill="#334155" stroke="#0f172a" stroke-width="1.5"/>

      <!-- Shimmering Sea Silk Ribbon -->
      <path d="M 85 110 C 140 80 180 140 230 100 
               C 270 70 310 130 330 160 
               L 310 210 C 260 180 220 220 170 180 
               C 130 150 100 200 70 170 Z" 
            fill="url(#purpleGlow)" stroke="#38bdf8" stroke-width="2" filter="url(#dropGlow)"/>

      <!-- Thread Fraying -->
      <path d="M 70 170 L 40 190 M 75 160 L 50 185 M 80 180 L 60 215" stroke="#38bdf8" stroke-width="1.5"/>
      <path d="M 330 160 L 355 150 M 325 180 L 360 190 M 315 205 L 340 230" stroke="#c084fc" stroke-width="1.5"/>

      <!-- Microscopic Callout Circle -->
      <g transform="translate(240, 240)">
        <circle cx="0" cy="0" r="42" fill="#0b0914" stroke="#38bdf8" stroke-width="2"/>
        <line x1="-30" y1="-10" x2="30" y2="10" stroke="#7dd3fc" stroke-width="2"/>
        <line x1="-25" y1="5" x2="25" y2="-5" stroke="#c084fc" stroke-width="2"/>
        <line x1="-15" y1="-25" x2="15" y2="25" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="0" y="24" fill="#a5f3fc" font-family="'Courier New', monospace" font-size="7" font-weight="bold" text-anchor="middle">PINNA NOBILIS</text>
        <text x="0" y="34" fill="#94a3b8" font-family="'Courier New', monospace" font-size="6.5" text-anchor="middle">TRUE SEA-SILK</text>
      </g>
    </g>

  <!-- Bottom Forensic Metric Scale -->
  <g transform="translate(40, 535)">
    <rect x="0" y="0" width="520" height="24" fill="rgba(15,12,25,0.8)" stroke="#4c1d95" stroke-width="1" rx="2"/>
    <!-- Centimeter ticks -->
    
      <line x1="0" y1="0" x2="0" y2="14" stroke="#c4b5fd" stroke-width="1.5"/>
      <text x="2" y="20" fill="#a78bfa" font-family="'Courier New', monospace" font-size="8">0cm</text>
    
      <line x1="20" y1="0" x2="20" y2="7" stroke="#c4b5fd" stroke-width="0.8"/>
      
    
      <line x1="40" y1="0" x2="40" y2="7" stroke="#c4b5fd" stroke-width="0.8"/>
      
    
      <line x1="60" y1="0" x2="60" y2="7" stroke="#c4b5fd" stroke-width="0.8"/>
      
    
      <line x1="80" y1="0" x2="80" y2="7" stroke="#c4b5fd" stroke-width="0.8"/>
      
    
      <line x1="100" y1="0" x2="100" y2="14" stroke="#c4b5fd" stroke-width="1.5"/>
      <text x="102" y="20" fill="#a78bfa" font-family="'Courier New', monospace" font-size="8">5cm</text>
    
      <line x1="120" y1="0" x2="120" y2="7" stroke="#c4b5fd" stroke-width="0.8"/>
      
    
      <line x1="140" y1="0" x2="140" y2="7" stroke="#c4b5fd" stroke-width="0.8"/>
      
    
      <line x1="160" y1="0" x2="160" y2="7" stroke="#c4b5fd" stroke-width="0.8"/>
      
    
      <line x1="180" y1="0" x2="180" y2="7" stroke="#c4b5fd" stroke-width="0.8"/>
      
    
      <line x1="200" y1="0" x2="200" y2="14" stroke="#c4b5fd" stroke-width="1.5"/>
      <text x="202" y="20" fill="#a78bfa" font-family="'Courier New', monospace" font-size="8">10cm</text>
    
      <line x1="220" y1="0" x2="220" y2="7" stroke="#c4b5fd" stroke-width="0.8"/>
      
    
      <line x1="240" y1="0" x2="240" y2="7" stroke="#c4b5fd" stroke-width="0.8"/>
      
    
      <line x1="260" y1="0" x2="260" y2="7" stroke="#c4b5fd" stroke-width="0.8"/>
      
    
      <line x1="280" y1="0" x2="280" y2="7" stroke="#c4b5fd" stroke-width="0.8"/>
      
    
      <line x1="300" y1="0" x2="300" y2="14" stroke="#c4b5fd" stroke-width="1.5"/>
      <text x="302" y="20" fill="#a78bfa" font-family="'Courier New', monospace" font-size="8">15cm</text>
    
      <line x1="320" y1="0" x2="320" y2="7" stroke="#c4b5fd" stroke-width="0.8"/>
      
    
      <line x1="340" y1="0" x2="340" y2="7" stroke="#c4b5fd" stroke-width="0.8"/>
      
    
      <line x1="360" y1="0" x2="360" y2="7" stroke="#c4b5fd" stroke-width="0.8"/>
      
    
      <line x1="380" y1="0" x2="380" y2="7" stroke="#c4b5fd" stroke-width="0.8"/>
      
    
      <line x1="400" y1="0" x2="400" y2="14" stroke="#c4b5fd" stroke-width="1.5"/>
      <text x="402" y="20" fill="#a78bfa" font-family="'Courier New', monospace" font-size="8">20cm</text>
    
      <line x1="420" y1="0" x2="420" y2="7" stroke="#c4b5fd" stroke-width="0.8"/>
      
    
      <line x1="440" y1="0" x2="440" y2="7" stroke="#c4b5fd" stroke-width="0.8"/>
      
    
      <line x1="460" y1="0" x2="460" y2="7" stroke="#c4b5fd" stroke-width="0.8"/>
      
    
      <line x1="480" y1="0" x2="480" y2="7" stroke="#c4b5fd" stroke-width="0.8"/>
      
    
      <line x1="500" y1="0" x2="500" y2="14" stroke="#c4b5fd" stroke-width="1.5"/>
      <text x="502" y="20" fill="#a78bfa" font-family="'Courier New', monospace" font-size="8">25cm</text>
    
      <line x1="520" y1="0" x2="520" y2="7" stroke="#c4b5fd" stroke-width="0.8"/>
      
    
    <text x="510" y="16" fill="#f59e0b" font-family="'Courier New', monospace" font-size="9" text-anchor="end">CONFIDENTIAL EVIDENCE</text>
  </g>
</svg>